name: Public source links
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "0.13.7", python-version: "3.12"}
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/check_links.py --online
