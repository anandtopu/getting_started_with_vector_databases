repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: strip-notebooks
        name: Clear notebook outputs
        entry: uv run nbstripout
        language: system
        files: '\.ipynb$'
