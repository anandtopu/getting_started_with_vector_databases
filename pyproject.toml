[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "getting-started-with-vector-databases"
version = "1.0.0"
description = "Build TinyVec and learn vector search with the synthetic Marlowe Market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.5.4", "pandas==3.1.1", "pyarrow==26.0.1",
  "scikit-learn==1.9.1", "pydantic==2.14.2", "pyyaml==6.0.3",
  "rich==15.0.0", "matplotlib==3.11.2", "faker==40.44.0",
  "pillow==13.0.0", "psutil==7.2.2", "python-dotenv==1.2.4",
  "httpx==0.28.1", "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
libs = ["faiss-cpu==1.15.1", "usearch==2.26.6", "bm25s==0.3.16"]
hnswlib = ["hnswlib==0.8.0"]
embedded = ["chromadb==1.5.9", "lancedb==0.41.0", "sqlite-vec==0.1.9", "duckdb==2.0.0"]
pgvector = ["psycopg[binary]==3.3.8", "pgvector==0.5.1"]
qdrant = ["qdrant-client==1.20.0"]
weaviate = ["weaviate-client==4.24.1"]
milvus = ["pymilvus==3.0.2"]
milvus-lite = ["pymilvus==3.0.2", "milvus-lite==3.2.2"]
models = ["sentence-transformers==6.2.0", "transformers==5.22.1", "torch==2.15.0", "safetensors==0.8.0", "huggingface-hub==2.4.0"]
rag = ["ollama==0.6.3"]
apps = ["fastapi==0.162.0", "uvicorn==0.54.0", "streamlit==1.66.1", "locust==2.47.0", "prometheus-client==0.26.0"]
ops = ["cryptography==50.0.2"]
landscape = ["elasticsearch==9.5.1", "redis==8.1.0", "pymongo==4.19.0", "pyvespa==1.2.10"]
managed = ["pinecone==10.3.0", "turbopuffer==3.1.0"]
notebooks = ["jupyter==1.1.1", "nbstripout==0.9.1"]
benchmarks = ["h5py==3.16.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-socket==0.8.1", "ruff==0.17.3", "pre-commit==4.7.0", "nbstripout==0.9.1"]

[tool.hatch.build.targets.wheel]
packages = ["common", "tinyvec"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "capstones"]
addopts = '-ra --strict-markers --disable-socket -m "not docker and not live"'
markers = ["docker: requires an explicitly started local database", "live: requires a real downloaded model", "embedded: requires the embedded extra"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".venv", "data", "research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Notebook cells mirror independent scripts and deliberately repeat imports/docstrings.
"*.ipynb" = ["E402", "F811"]
